# monocream by stianhoiland
#
# A minimal, monochrome-ish, amber, no-blue dark theme inspired by the plan9's
# sam color palette--but dark!
# - 2 background shades (191900, 28281E)
# - 2 foreground shades (FFFFE6, A1A195)
# - 3 accent colors: Red, green, yellow (DC5046, 78C878, 78C878)
#
# Matching Windows 11 accent color: 797A4C
# - This color looks absolutely hideous in the Windows 11 accent color picker,
#   but the color it actually gives window borders and title bars is different
#   and matches this color theme beautifully.
#
# Copy it into your prospero.ini, or include it above the first section
# (a relative path is from prospero.ini's directory), then pick it:
#
#   include = themes/monocream.ini
#   [ui]
#   theme = monocream
#
[theme monocream]
base = dark
gap = #191900
panel = #191900
panel_text = #FFFFE6
