# Gruvbox, a dark theme of retro groove colors, at hard contrast: bg0_h
# panels, bg0 code blocks, bg1 buttons. Its palette is Pavel Pertsev's
# Gruvbox; Arthur Cnops (accnops) chose the colors for Prospero.
#
# Copy it into your prospero.ini, or include it above the first section
# (a relative path is from prospero.ini's directory), then pick it:
#
#   include = themes/gruvbox.ini
#   [ui]
#   theme = gruvbox
#
[theme gruvbox]
base = dark
gap = #282828
panel = #1d2021
panel_text = #ebdbb2
panel_dim = #bdae93
field = #3c3836
field_hover = #504945
