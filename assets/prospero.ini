# prospero.ini: settings for Prospero
#
# Prospero wrote this file on its first run, from its built-in copy. Edit
# it by hand or in the settings window, which changes only the lines it
# sets and keeps comments, blank lines and order. Changes take effect
# while Prospero runs, from the next request on.
#
# It lives at $XDG_CONFIG_HOME/prospero/prospero.ini, which defaults to
# ~/.config/prospero/prospero.ini. On Windows, %XDG_CONFIG_HOME% and
# %HOME%\.config are tried first, then %APPDATA%\prospero\prospero.ini.
#
# Syntax
#
#   [kind name]          a section header; [kind] for kinds without names
#   key = value          a setting
#   # comment            a whole line starting with # or ; is a comment,
#   key = value  # note  and so is the rest of a line after a lone #
#
# A # starts a comment only with blanks around it, so values such as
# #ff99ff or a URL with a #fragment need no quotes. Quote a value with
# "..." to keep blanks at either end or a lone # in it; inside quotes,
# write \" for a quote and \\ for a backslash. Times are in seconds and
# may have a fraction (2.5). An unknown key or a bad value is reported
# in the diagnostics panel, and a bad value falls back to its default:
# nothing here can keep Prospero from starting.
#
# Secrets
#
# API keys never go in this file. Write key = env:NAME, and Prospero
# reads the key from environment variable NAME when it makes a request,
# or key = file:PATH, a file holding just the key, absolute or under ~,
# for an engine whose environment you cannot set, as on a remote host
# (keep the file private: chmod 600). An included file cannot use a
# file:PATH, which could send any of your files.
#
# Includes
#
# A shared file, such as a team's endpoints and models, can be included
# above the first section. Its settings apply at the include line, so
# whatever this file sets below it wins. A relative path is taken from
# this file's directory. The settings window always edits this file,
# never an included one. An included file cannot choose what runs: its
# plaintext secrets are ignored, and so are its [remote], [shell], [mcp]
# and [desktop] sections, [tools] path_prepend, path_append, shells and
# git, a [tools] shell other than auto, sh, bash, powershell or cmd,
# and [ui] editor and terminal. Only this file can.
#
# An include may be an http:// or https:// URL. Prospero fetches it as it
# starts, waiting up to 30 seconds the first time, keeps a copy in its
# state directory, and fetches it again in the background at most every
# 10 minutes. When the server cannot be reached, the copy is used, with
# a warning that says how old it is. Includes in a file from a URL are
# taken relative to its URL. To accept only one version of the file, pin
# its SHA-256, which the diagnostics show when it does not match: another
# version is then an error and is not used.
#
# include = team.ini
# include = https://example.com/prospero.ini
# include = https://example.com/prospero.ini sha256=<64 hex digits>

# Defaults for new sessions: a model, as ENDPOINT/MODEL, ENDPOINT the
# name of a section below and MODEL as it names the model, and so the
# endpoint too. A session may pick others when it starts. A model
# without its endpoint goes to the endpoint set here, as the name of a
# section below or as a URL, else to one that listed it, else to the
# first section below with a url. Without a model, the first [model]
# section, else the first model the endpoint lists.
# model = local/qwen3-coder
# endpoint = local


# [endpoint NAME]: a server of models, OpenAI-compatible (llama.cpp,
# vLLM, LiteLLM, ...) or Anthropic's
#
#   url                 base URL; chat requests go to URL/v1/chat/completions,
#                       or for kind anthropic to URL/v1/messages
#   kind                the API it speaks: openai, Chat Completions
#                       (default), or anthropic, the Messages API
#   key                 API key, sent as a bearer token, or as x-api-key
#                       for kind anthropic: env:NAME or file:PATH only
#   connect_timeout     seconds to connect (default 5 local, 15 remote)
#   first_byte_timeout  seconds until a response starts, loading the model
#                       and reading the prompt included (default 1800
#                       local, 300 remote)
#   idle_timeout        seconds of silence once a response started,
#                       counting the server's keep-alive pings as data
#                       (default 90)
#   progress_timeout    seconds without new output or prompt progress
#                       (default 600)
#   slow_retry          seconds between slow retries, once ten quick ones
#                       have failed, the last repeating (default
#                       60 120 300 600 900)
#   slow_retry_budget   seconds of slow retries before a turn gives up
#                       (default 7200)
#   max_concurrent      most requests in flight at once (default: no
#                       limit)
#   max_models          most different models in flight at once (default:
#                       what a llama.cpp router reports, max_instances,
#                       so that its models are not loaded over and over)
#
# Local means loopback, private network (10.x, 172.16-31.x, 192.168.x)
# and .local hosts. A timeout is a transient failure: Prospero retries
# with backoff, and continues rather than repeats a partial response.
# When the quick retries fail, a model's fallbacks are tried, then slow
# retries wait minutes rather than give up. Requests beyond a limit
# wait their turn, first come, first served.

# A llama.cpp server, or its router serving several models, on this
# machine.
[endpoint local]
url = http://localhost/

# A llama.cpp router on another machine, serving the models of a
# directory (llama-server --models-dir DIR), two of them loaded at most.
#
# [endpoint router]
# url = http://gpu.local:8080/
# max_models = 2

# Another OpenAI-compatible server, such as vLLM or LiteLLM, with its key
# taken from an environment variable.
#
# [endpoint vllm]
# url = https://llm.example.com/v1/
# key = env:VLLM_API_KEY

# Anthropic's Messages API, with the key taken from the ANTHROPIC_API_KEY
# environment variable. Its listing gives each model's context and
# output limits.
#
# [endpoint anthropic]
# kind = anthropic
# url = https://api.anthropic.com/
# key = env:ANTHROPIC_API_KEY


# [model NAME]: settings for one model, NAME as its endpoint lists it,
# or a variant of one under a name of its own
#
#   like          another model whose settings this one takes, except
#                 those it sets itself (set one empty for its default):
#                 a variant, such as the same model thinking harder.
#                 That model may be like a third, and so on.
#   id            the model's name in requests (default: the id of the
#                 model it is like, else NAME), so that a variant and
#                 its model are the same model to the server, sharing
#                 its limits and its place on a router
#   reasoning     how the model's reasoning goes back to it in later
#                 requests: as the field reasoning_content (default),
#                 reasoning or reasoning_text, or none to leave it out
#   context       context limit in tokens, for a server that does not
#                 report it
#   compactor     the model that summarizes a conversation grown too long
#                 for the context, as MODEL (on the same endpoint) or
#                 ENDPOINT/MODEL (default: this model)
#   fallback      models to use in turn when this one keeps failing or
#                 hits a usage limit, each MODEL or ENDPOINT/MODEL,
#                 separated by blanks
#   fallback_cooldown
#                 seconds on a fallback before this model is tried
#                 again (default 600)
#   subagent_model
#                 the model for the subagents of a session on this one,
#                 MODEL or ENDPOINT/MODEL, unless the task or its role
#                 names one (default: this model)
#   reasoning_budget
#                 most reasoning tokens in one response; past it,
#                 llama.cpp is told to end the reasoning, and another
#                 server's response is cut off with a reminder; with
#                 thinking = budget, Anthropic's thinking budget
#   thinking      for kind anthropic: adaptive, the model deciding how
#                 much to think (default); budget, a fixed budget of
#                 reasoning_budget tokens (default 8192), for models
#                 older than adaptive thinking; off, which Claude Opus
#                 5.5 and Sonnet 5.5 refuse, failing every request, and
#                 Haiku 5.5 takes only at effort high or below (lower
#                 the effort instead); between_tools, Sonnet 5.5's own
#                 way to turn thinking off, at effort high or below; or
#                 default, to let the model choose, sending nothing
#   thinking_display
#                 for kind anthropic: summarized, a summary of the
#                 reasoning to show (default), or omitted
#   effort        for kind anthropic: how much the model thinks and
#                 writes, low, medium, high, xhigh or max (default: the
#                 model's own)
#   vision        whether the model takes images: the desktop tool's
#                 screenshots and image files read (default: true)
#   coordinates   how the model gives points in a screenshot: pixels of
#                 the image it was sent (default), or norm1000,
#                 thousandths of its width and height, as Qwen-VL and
#                 Gemini do
#   image_edge, image_pixels
#                 the longest side of a screenshot sent to the model, and
#                 the most pixels in all; larger ones are scaled down
#                 (default: 1568 and 1150000 for kind anthropic, else
#                 1280 and 1048576)
#   edit_format   how the edit tool takes changes: replace, old text and
#                 its new text (default); patch, an apply_patch envelope
#                 (*** Begin Patch); or hashline, line numbers that read
#                 shows, checked against a tag of the file's content.
#                 Models differ in which they get right most often: see
#                 tests/bench/RESULTS.md. A session keeps the format it
#                 started with.
#   empty_retries times the model is reminded to go on after a response
#                 with no text and no tool calls, in a row, before the
#                 turn ends (default: 2; 0 ends it at the first)
#   max_concurrent
#                 most requests for this model at once (default: the
#                 server's slots, else 4)
#   temperature, top_p, top_k, min_p, presence_penalty,
#   frequency_penalty, repeat_penalty, seed, max_tokens
#                 sampling, sent to the server as written; a parameter
#                 not set here is not sent, so the server's own default
#                 (often the model's recommended setting) applies. Kind
#                 anthropic takes temperature, top_p and top_k (which
#                 its newest models refuse), and always gets max_tokens
#                 (default 32000, at most what the model allows)
#   template.NAME an argument of the model's chat template, sent in
#                 chat_template_kwargs (llama.cpp, vLLM; never to kind
#                 anthropic), as many as the template takes: true and
#                 false as booleans, numbers as numbers, anything else
#                 as a string, and a value in quotes always as a string
#
# A model of a llama.cpp router, with its recommended sampling and the
# edit format it does best with:
#
# [model qwen3-coder]
# temperature = 0.7
# top_p = 0.8
# top_k = 20
# edit_format = hashline
#
# A model whose chat template thinks only when asked to, and variants of
# it that think less, more, and not at all, each a model of its own
# name (large-quick, ...) to the server's one model, large:
#
# [model large]
# top_p = 0.95
# max_tokens = 32768
# template.thinking = true
#
# [model large-quick]
# like = large
# template.reasoning_effort = 25
#
# [model large-deep]
# like = large
# template.reasoning_effort = 100
# max_tokens = 65536
#
# [model large-nothink]
# like = large
# template.thinking = false
#
# Anthropic's models, at the endpoint above. Opus thinks harder for the
# hard work, falling back to Sonnet should it keep failing, and Haiku,
# fast and cheap, summarizes long conversations for both:
#
# [model claude-opus-5-5]
# effort = high
# fallback = claude-sonnet-5-5
# compactor = claude-haiku-5-5
#
# [model claude-sonnet-5-5]
# max_tokens = 64000
# compactor = claude-haiku-5-5
#
# [model claude-haiku-5-5]
# effort = low


# [role NAME]: instructions, a model and tools for one kind of work: for
# a session started with that role, or a subagent an agent starts with
# its task tool, which offers every role defined here.
#
#   description  what the role is for, which an agent reads when it
#                picks a role for a subagent
#   prompt       instructions added to the system prompt
#   endpoint     endpoint for the role (default: the session's own, or
#                for a subagent, its parent's)
#   model        model for the role, MODEL or ENDPOINT/MODEL (default:
#                the session's own, or for a subagent, its parent's
#                model's subagent_model, else the parent's model)
#   tools        tools the role may use, of read, write, edit, shell,
#                grep, glob, todo_write, jobs, job_output, job_kill,
#                task, desktop, skill, sessions, send_message,
#                web_search and web_fetch, read left to right: * is
#                every tool, default those of a role that names none,
#                and -NAME takes one away, as in "default desktop" or
#                "* -shell" (default: all of them but desktop); desktop
#                and the web's need [desktop] and [web] as well
#
# A subagent may start subagents of its own, but theirs get no task
# tool. A subagent is told to wrap up after [tools] task_budget model
# requests, and stopped at half as many again.
#
# Two roles are built in: explore, which finds and reads code to answer
# a question and reports what it found, with read, grep, glob and skill;
# and general, which does any task with every tool, and is a subagent's
# role unless the agent names another. A section of either name changes
# the keys it sets, and the rest stay as built in.
#
# [role explore]
# endpoint = anthropic
# model = claude-haiku-5-5
#
# [role review]
# description = Reviews a change for bugs, without changing anything
# prompt = Review the change for bugs and report them. Do not edit files.
# tools = read grep glob shell


# [guard]: where the file tools may go without asking. A session's own
# working directory is always allowed.
#
#   roots        more directories, separated by ";", where ~ is the
#                home directory
#   ask_timeout  seconds to wait for your answer when a tool asks to go
#                elsewhere, before denying it (default: 30)
#   temp         the system's temporary directory: allow the file tools
#                there without asking (default), or ask, as anywhere
#                else outside the roots
#
# [guard]
# roots = ~/src/shared; /tmp/scratch
# ask_timeout = 60


# [tools]: background jobs, stopping commands, and search. A command
# still running at its timeout moves to the background as a job, and
# the agent is told when it ends.
#
#   job_timeout      seconds a background job may run, unless the agent
#                    asks for another limit (default: 1800)
#   job_timeout_max  most seconds the agent may ask for (default: 7200)
#   auto_resume      turns a session may start by itself in an hour, to
#                    report jobs that ended while it was idle; 0 for
#                    none (default: 5)
#   stop_grace       seconds between asking a command to stop (SIGTERM,
#                    or CTRL_BREAK on Windows) and killing it (default:
#                    2, or 3 on Windows)
#   shell            the agent's shell for new sessions: auto, sh,
#                    bash, powershell, cmd, a [shell] section by its
#                    name, or a program by its path or its name on PATH
#                    (default: auto: on Linux and macOS bash on PATH,
#                    on macOS a Homebrew or MacPorts bash ahead of the
#                    system's bash 3.2, else /bin/sh; on Windows a
#                    POSIX sh, else PowerShell, then cmd). sh is
#                    /bin/sh, even where that is bash. On Windows bash
#                    is a program
#   shells           shells the agent may pick for a command, besides
#                    the session's own: [shell] sections, or sh,
#                    bash, powershell and cmd, separated by blanks
#   path_prepend     directories to find programs in before PATH,
#                    separated by ;, absolute or starting with ~: for
#                    the agent's commands, its shell and ripgrep, and
#                    what Prospero runs itself, the editor and ssh.
#                    Prospero started from the Finder or a desktop menu
#                    gets a short PATH, without what a shell adds
#   path_append      directories to find programs in after PATH, as
#                    for path_prepend. A remote engine goes by its own
#                    machine's settings, not these
#   use_rg           search with ripgrep, rg on PATH, when it is found;
#                    false always uses the built-in search (default:
#                    true)
#   git              the git that shows a session's changes, in the
#                    Changes pane: its path, or its name on PATH
#                    (default: git on PATH, with path_prepend and
#                    path_append). The branch is read without it
#   turn_budget      model requests a turn may make before it ends;
#                    0 for no limit (default: 0)
#   task_budget      model requests a subagent may make before it is
#                    told to wrap up and report; at half as many again
#                    it is stopped, and its report is what it said last
#                    (default: 200)
#
# [tools]
# job_timeout = 3600
# path_prepend = ~/.local/bin; /opt/homebrew/bin


# [shell NAME]: a shell for the agent's commands, which [tools] shell
# may name. Only your own file's [shell] sections count, not an
# included file's, since they choose what runs.
#
#   program       its executable, by its path or its name on PATH, or
#                 sh, powershell or cmd (default: NAME, so [shell zsh]
#                 alone finds zsh, and [shell powershell] adjusts the
#                 usual one). On Windows, wsl runs commands in WSL's sh
#   distro        for wsl, the distro to run in, as wsl -l lists it
#                 (default: the default one)
#   login         start it as a login shell: sh with -l, so its profile
#                 sets it up, PowerShell with your profile, cmd with its
#                 AutoRun (default: false). On Windows, MSYS2's and
#                 Git's profile keep the working directory and PATH,
#                 after their own directories (env.MSYS2_PATH_TYPE =
#                 minimal for MSYS2's own default, which drops PATH)
#   env.NAME      an environment variable for its commands; env:VAR
#                 takes it from Prospero's own environment
#   path_prepend  directories to find programs in before [tools]
#                 path_prepend's and PATH, its own program too
#   path_append   directories to find programs in after them. For wsl,
#                 both are Linux directories, ~ for the distro's home
#   description   told to the agent along with what Prospero says of
#                 the shell: what it is for, and what it has
#
# [shell w64devkit]
# program = C:/w64devkit/bin/sh.exe
# path_prepend = C:/w64devkit/bin
# description = w64devkit: GCC, GDB and make, for native Windows programs
#
# [shell msys2]
# program = C:/msys64/usr/bin/bash.exe
# login = true
# env.MSYSTEM = UCRT64
# description = MSYS2 UCRT64, with pacman to install packages
#
# [shell debian]
# program = wsl
# distro = Debian
# description = Debian, with apt to install packages


# [instructions]: files of instructions for the agent, read when a
# session starts: AGENTS.md in the default configuration directory
# (next to this file, unless -c named it), then one file in each
# directory from the root of the repository down to the working
# directory, and later ones below it, as the agent works there.
#
#   files  names to look for in each directory, the first one found
#          used, separated by blanks (default: AGENTS.md CLAUDE.md)
#
# [instructions]
# files = AGENTS.md


# [skills]: skills, as Claude Code and other harnesses have them: each a
# directory NAME holding SKILL.md, whose frontmatter gives its name and
# description, which the agent sees, and whose text it reads through
# its skill tool when a task calls for it; /NAME in the compose box
# invokes one, perhaps below folders that group skills. Looked for in
# .claude/skills, .agents/skills, .cursor/skills and .codex/skills of
# each directory from the working directory up to the repository root,
# then in paths, then in skills next to this file, then in the same four
# under ~: the first of a name wins. Prospero's own, prospero, its help
# and settings, comes last: only one of yours by that name replaces it.
#
#   enabled  offer skills (default: true)
#   paths    more directories of skills, separated by ;
#
# [skills]
# paths = ~/src/team-skills


# [memory]: the agent's own notes for later sessions in a project,
# which it saves and forgets with its memory tool: MEMORY.md, an index
# of one line per memory, given to each new session in the project,
# and a file for each, in Claude Code's format. Each project's are in
# a directory of their own below path, named for the project's root
# (the main checkout, for a worktree), local to this machine.
#
#   enabled  give top-level sessions in a folder memory (default: true)
#   path     where projects' memory is kept (default: memory in the
#            state directory)
#
# [memory]
# enabled = false


# [desktop]: the desktop tool, with which the agent sees the screen and
# uses the mouse and keyboard, through a helper: prospero itself on
# Windows and in a Linux build from source, else prospero-desktop next
# to prospero (macOS, and Linux on X11 or Wayland). Only your own file
# can turn it on: an included file's [desktop] settings are ignored.
#
#   offer        which sessions get the tool, where it can work (its
#                helper is found, and a display on Linux): none, roles
#                whose tools list desktop, or all, sessions without a
#                role too (default)
#   ask          ask before every action, the screenshots too, denying
#                it when nobody answers in time (default: true); false
#                lets the agent act unattended
#   ask_timeout  seconds to wait for your answer (default: 60)
#   images       screenshots and image files read kept in the
#                conversation, the latest ones; older ones are left out
#                of requests (default: 3)
#   images_slack images kept beyond images before older ones are left
#                out, all at once, back to images, so that the prompt
#                cache hits between those steps (default: 4; 0 leaves
#                one out at each new image)
#
# [desktop]
# offer = roles
#
# [role gui]
# description = Builds programs and tries them on the screen
# tools = default desktop


# [web]: web search and reading web pages, the web_search and web_fetch
# tools, for each session whose role does not leave them out. Only your
# own file can turn them on: an included file's [web] settings are
# ignored. Each search and each page read asks you first, unless ask is
# false; Always allows every search, or every page of one site, for the
# session and its subagents. A session nobody attends is denied.
#
#   search    the service web_search uses: none (default: no
#             web_search), searxng (an instance at url, whose
#             settings.yml lists json in search: formats), exa (Exa's
#             MCP endpoint, which needs no key), or anthropic (a model
#             of an endpoint of kind anthropic searches, at $10 per
#             1000 searches besides its tokens)
#   url       for searxng: the instance's URL
#   key       for exa: an API key, as env:NAME or file:PATH, for more
#             searches than Exa allows without one
#   model     for anthropic: ENDPOINT/MODEL (default: claude-haiku-5-5
#             at the first endpoint of kind anthropic)
#   fetch     offer web_fetch, which reads a page over https whose URL
#             appeared in the conversation, never a local address
#             (default: true)
#   ask       ask before each search and page read (default: true);
#             false lets the agent use the web unattended, as prospero
#             run needs
#   results   results a search returns, at most 20 (default: 8)
#   searches  searches a session and its subagents may make while it
#             is open (default: 200)
#
# [web]
# search = searxng
# url = http://localhost:8888/
#
# [role research]
# description = Searches the web and reads pages to answer a question
# tools = web_search web_fetch


# [ui]: how the GUI looks.
#
#   theme     colors: dark, light, or system to follow the operating
#             system's setting as it changes (default: system)
#   thinking  the model's reasoning in the transcript: fold, a line
#             counting it as it streams, which a click opens; open; or
#             hide, while the session log keeps it and the model still
#             gets it back (default: fold)
#   tools     tool output in the transcript: auto folds reads, writes,
#             todo lists, background jobs and shell output over 24
#             lines, and opens failures; fold or open applies to every
#             row; a click on a row's header opens or folds it whatever
#             this says (default: auto)
#   font_size text size in pixels at 100% display scale, 8 to 40,
#             which the View menu's zoom scales until Prospero exits:
#             Ctrl+= and Ctrl+- (Cmd on macOS), Ctrl+0 to reset, or
#             Ctrl and the mouse wheel (default: 17)
#   editor    the command that opens a draft in an editor (Ctrl+G, or
#             the compose box's menu), given the file as one more word.
#             It must wait until the editing is done, as code --wait,
#             subl -w or gvim -f do, and open a window of its own: there
#             is no terminal. Empty: $VISUAL, else $EDITOR, else on
#             macOS the default text editor (open -W -n -t), which must
#             then be quit. Prospero started from the Finder or a
#             desktop menu has no shell environment, so no $VISUAL or
#             $EDITOR, and a PATH that may lack the editor: name it here,
#             in full or with its directory in [tools] path_prepend
#             (default: empty)
#   notify    desktop notifications while the window is in the
#             background, minimized, or showing another session:
#             allow, when a permission ask waits for your answer; done,
#             when a session stops by itself (finished, failed, or out
#             of budget), not when you stop it; none for neither. A
#             click brings the window to that session. macOS shows
#             them for Prospero.app only (default: allow done)
#
# [ui]
# theme = light
# thinking = hide
# tools = fold
# font_size = 15
# editor = code --wait
# notify = allow


# [host]: the engine as a background host ("prospero serve"), which
# "prospero attach" starts for a client over ssh, and reaches through a
# socket only this user may use (a named pipe on Windows). A window
# closed with "Keep running in background" makes its own process such
# a host, with a tray icon, until its sessions are done.
#
#   idle_exit  seconds the host waits with no client connected and
#              nothing running, then exits (default: 600)
#   grace      seconds the host keeps the place of a client whose
#              connection broke, and its records, for when it comes
#              back (default: 10800)
#
# [host]
# idle_exit = 3600


# [remote NAME]: an engine on another machine, reached over ssh, which
# "prospero attach" starts there if none runs ("prospero connect NAME").
# The window's Hosts panel adds one, and connects to it. On Windows,
# each installed WSL distro is a remote too, by its name, with no
# section needed.
#
#   ssh     where ssh reaches the machine: [user@]host, or a Host of
#           ~/.ssh/config
#   wsl     instead of ssh, a WSL distro on this Windows machine, as
#           wsl --list names it, reached through wsl.exe
#   path    the prospero executable there, a path or a name on its
#           PATH (default: the engine "prospero deploy NAME" put in
#           ~/.prospero there, else prospero)
#   state   the state directory there (default: its own)
#   config  the configuration file there (default: its own)
#   deploy  when the machine has no engine, or an older one: ask,
#           where the Hosts pane offers Deploy engine or Update
#           engine, or auto to deploy it unasked (default: ask)
#   list    when the window's session list shows the host: always
#           (default), or connected, which leaves it out while it is
#           disconnected
#   subagents
#           whether the agent's task tool may start a subagent there,
#           which works under that machine's own settings and reports
#           back: yes (default) or no
#
# [remote pi]
# ssh = pi.local
# deploy = auto
#
# [remote deb]
# wsl = Debian


# [mcp NAME]: an MCP server, whose tools sessions may use, named
# mcp__NAME__TOOL. Each runs as a program that speaks over its standard
# input and output, started for the sessions that use it and stopped
# a minute after the last one is gone, its standard error in a log in
# the state directory; or it is reached over HTTP, at a url. A session
# asks before each call, unless the server is trusted, with an
# "always" for all of that server's tools. A role with a tools list
# gets MCP tools only by naming them: mcp__NAME for all of a server's,
# or mcp__NAME__TOOL.
# A server over HTTP that wants a sign-in gets one through the
# browser: Settings, at the server's page, or "prospero mcp auth NAME".
# Settings here run programs, so an included file cannot give them.
#
#   command          the program and its arguments, split at blanks,
#                    with '...' or "..." quoting (no shell); begin it
#                    with ' rather than ", which would quote the value
#   cwd              where it runs (default: the session's folder)
#   env.VAR          an environment variable for it, a value or
#                    env:NAME for this one's
#   url              instead of a command, its address over HTTP
#                    (Streamable HTTP)
#   header.NAME      a header for its requests, a value or env:VAR
#   token            a bearer token for it, as env:VAR, for a server
#                    that takes one in place of signing in
#   client_id        signing in: the OAuth client to be, for a server
#                    that does not register clients itself
#   client_secret    that client's secret, as env:VAR, if any
#   scope            signing in: the scopes to ask for (default: the
#                    server's)
#   trust            yes to run its tools without asking (default: no)
#   tools            only these of its tools, by its names for them
#                    (default: all)
#   enabled          no to leave it out (default: yes)
#   startup_timeout  seconds it may take to start (default: 30)
#   timeout          seconds a call may take (default: 600)
#
# [mcp stars]
# command = uv run tools/starsmcp.py
# cwd = ~/src/StarsVM
# startup_timeout = 120
#
# [mcp docs]
# url = https://mcp.example.com/mcp
# token = env:DOCS_TOKEN
