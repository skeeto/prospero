# prospero.ini: settings for Prospero
#
# Prospero wrote this file on its first run, from its built-in copy. Edit
# it by hand or in the settings window, which changes only the lines it
# sets and keeps comments, blank lines and order. Changes take effect
# while Prospero runs, from the next request on.
#
# It lives at $XDG_CONFIG_HOME/prospero/prospero.ini, which defaults to
# ~/.config/prospero/prospero.ini. On Windows, %XDG_CONFIG_HOME% and
# %HOME%\.config are tried first, then %APPDATA%\prospero\prospero.ini.
#
# Syntax
#
#   [kind name]          a section header; [kind] for kinds without names
#   key = value          a setting
#   # comment            a whole line starting with # or ; is a comment,
#   key = value  # note  and so is the rest of a line after a lone #
#
# A # starts a comment only with blanks around it, so values such as
# #ff99ff or a URL with a #fragment need no quotes. Quote a value with
# "..." to keep blanks at either end or a lone # in it; inside quotes,
# write \" for a quote and \\ for a backslash. Times are in seconds and
# may have a fraction (2.5). An unknown key or a bad value is reported
# in the diagnostics panel, and a bad value falls back to its default:
# nothing here can keep Prospero from starting.
#
# Secrets
#
# API keys never go in this file. Write key = env:NAME, and Prospero
# reads the key from environment variable NAME when it makes a request.
#
# Includes
#
# A shared file, such as a team's endpoints and models, can be included
# above the first section. Its settings apply at the include line, so
# whatever this file sets below it wins. A relative path is taken from
# this file's directory. The settings window always edits this file,
# never an included one, and an included file's plaintext secrets are
# ignored. Nothing in any of these files can make Prospero run a command.
#
# An include may be an http:// or https:// URL. Prospero fetches it as it
# starts, waiting up to 30 seconds the first time, keeps a copy in its
# state directory, and fetches it again in the background at most every
# 10 minutes. When the server cannot be reached, the copy is used, with
# a warning that says how old it is. Includes in a file from a URL are
# taken relative to its URL. To accept only one version of the file, pin
# its SHA-256, which the diagnostics show when it does not match: another
# version is then an error and is not used.
#
# include = team.ini
# include = https://example.com/prospero.ini
# include = https://example.com/prospero.ini sha256=<64 hex digits>

# Defaults for new sessions: an endpoint, as the name of a section below
# or as a URL, and a model, as that endpoint names it. A session may
# pick others when it starts.
endpoint = local
# model = qwen3-coder


# [endpoint NAME]: a server of models, OpenAI-compatible (llama.cpp,
# vLLM, LiteLLM, ...) or Anthropic's
#
#   url                 base URL; chat requests go to URL/v1/chat/completions,
#                       or for kind anthropic to URL/v1/messages
#   kind                the API it speaks: openai, Chat Completions
#                       (default), or anthropic, the Messages API
#   key                 API key, sent as a bearer token, or as x-api-key
#                       for kind anthropic: env:NAME only
#   connect_timeout     seconds to connect (default 5 local, 15 remote)
#   first_byte_timeout  seconds until a response starts, loading the model
#                       and reading the prompt included (default 1800
#                       local, 300 remote)
#   idle_timeout        seconds of silence once a response started,
#                       counting the server's keep-alive pings as data
#                       (default 90)
#   progress_timeout    seconds without new output or prompt progress
#                       (default 600)
#   slow_retry          seconds between slow retries, once ten quick ones
#                       have failed, the last repeating (default
#                       60 120 300 600 900)
#   slow_retry_budget   seconds of slow retries before a turn gives up
#                       (default 7200)
#   max_concurrent      most requests in flight at once (default: no
#                       limit)
#   max_models          most different models in flight at once (default:
#                       what a llama.cpp router reports, max_instances,
#                       so that its models are not loaded over and over)
#
# Local means loopback, private network (10.x, 172.16-31.x, 192.168.x)
# and .local hosts. A timeout is a transient failure: Prospero retries
# with backoff, and continues rather than repeats a partial response.
# When the quick retries fail, a model's fallbacks are tried, then slow
# retries wait minutes rather than give up. Requests beyond a limit
# wait their turn, first come, first served.

# A llama.cpp server, or its router serving several models, on this
# machine.
[endpoint local]
url = http://localhost/

# A llama.cpp router on another machine, serving the models of a
# directory (llama-server --models-dir DIR), two of them loaded at most.
#
# [endpoint router]
# url = http://gpu.local:8080/
# max_models = 2

# Another OpenAI-compatible server, such as vLLM or LiteLLM, with its key
# taken from an environment variable.
#
# [endpoint vllm]
# url = https://llm.example.com/v1/
# key = env:VLLM_API_KEY

# Anthropic's Messages API, with the key taken from the ANTHROPIC_API_KEY
# environment variable. Its listing gives each model's context and
# output limits.
#
# [endpoint anthropic]
# kind = anthropic
# url = https://api.anthropic.com/
# key = env:ANTHROPIC_API_KEY


# [model NAME]: settings for one model, NAME as its endpoint lists it
#
#   reasoning     how the model's reasoning goes back to it in later
#                 requests: as the field reasoning_content (default),
#                 reasoning or reasoning_text, or none to leave it out
#   context       context limit in tokens, for a server that does not
#                 report it
#   compactor     the model that summarizes a conversation grown too long
#                 for the context, as MODEL (on the same endpoint) or
#                 ENDPOINT/MODEL (default: this model)
#   fallback      models to use in turn when this one keeps failing or
#                 hits a usage limit, each MODEL or ENDPOINT/MODEL,
#                 separated by blanks
#   fallback_cooldown
#                 seconds on a fallback before this model is tried
#                 again (default 600)
#   reasoning_budget
#                 most reasoning tokens in one response; past it,
#                 llama.cpp is told to end the reasoning, and another
#                 server's response is cut off with a reminder; with
#                 thinking = budget, Anthropic's thinking budget
#   thinking      for kind anthropic: adaptive, the model deciding how
#                 much to think (default); budget, a fixed budget of
#                 reasoning_budget tokens (default 8192), for models
#                 older than adaptive thinking; off, which Claude Opus
#                 5.5 and Sonnet 5.5 refuse, failing every request, and
#                 Haiku 5.5 takes only at effort high or below (lower
#                 the effort instead); between_tools, Sonnet 5.5's own
#                 way to turn thinking off, at effort high or below; or
#                 default, to let the model choose, sending nothing
#   thinking_display
#                 for kind anthropic: summarized, a summary of the
#                 reasoning to show (default), or omitted
#   effort        for kind anthropic: how much the model thinks and
#                 writes, low, medium, high, xhigh or max (default: the
#                 model's own)
#   edit_format   how the edit tool takes changes: replace, old text and
#                 its new text (default); patch, an apply_patch envelope
#                 (*** Begin Patch); or hashline, line numbers that read
#                 shows, checked against a tag of the file's content.
#                 Models differ in which they get right most often: see
#                 tests/bench/RESULTS.md. A session keeps the format it
#                 started with.
#   max_concurrent
#                 most requests for this model at once (default: the
#                 server's slots, else 4)
#   temperature, top_p, top_k, min_p, presence_penalty,
#   frequency_penalty, repeat_penalty, seed, max_tokens
#                 sampling, sent to the server as written; a parameter
#                 not set here is not sent, so the server's own default
#                 (often the model's recommended setting) applies. Kind
#                 anthropic takes temperature, top_p and top_k (which
#                 its newest models refuse), and always gets max_tokens
#                 (default 32000, at most what the model allows)
#
# A model of a llama.cpp router, with its recommended sampling and the
# edit format it does best with:
#
# [model qwen3-coder]
# temperature = 0.7
# top_p = 0.8
# top_k = 20
# edit_format = hashline
#
# Anthropic's models, at the endpoint above. Opus thinks harder for the
# hard work, falling back to Sonnet should it keep failing, and Haiku,
# fast and cheap, summarizes long conversations for both:
#
# [model claude-opus-5-5]
# effort = high
# fallback = claude-sonnet-5-5
# compactor = claude-haiku-5-5
#
# [model claude-sonnet-5-5]
# max_tokens = 64000
# compactor = claude-haiku-5-5
#
# [model claude-haiku-5-5]
# effort = low


# [role NAME]: instructions, a model and tools for one kind of work: for
# a session started with that role, or a subagent an agent starts with
# its task tool, which offers every role defined here.
#
#   description  what the role is for, which an agent reads when it
#                picks a role for a subagent
#   prompt       instructions added to the system prompt
#   endpoint     endpoint for the role (default: the session's own, or
#                for a subagent, its parent's)
#   model        model for the role (default: likewise)
#   tools        tools the role may use, of read, write, edit, shell,
#                grep, glob, todo_write, jobs, job_output, job_kill and
#                task (default: all of them)
#
# A subagent may start subagents of its own, but theirs get no task
# tool. A subagent is told to wrap up after [tools] task_budget model
# requests, and stopped at half as many again.
#
# Two roles are built in: explore, which finds and reads code to answer
# a question and reports what it found, with read, grep and glob only;
# and general, which does any task with every tool, and is a subagent's
# role unless the agent names another. A section of either name changes
# the keys it sets, and the rest stay as built in.
#
# [role explore]
# endpoint = anthropic
# model = claude-haiku-5-5
#
# [role review]
# description = Reviews a change for bugs, without changing anything
# prompt = Review the change for bugs and report them. Do not edit files.
# tools = read grep glob shell


# [guard]: where the file tools may go without asking. A session's own
# working directory is always allowed.
#
#   roots        more directories, separated by ";", where ~ is the
#                home directory
#   ask_timeout  seconds to wait for your answer when a tool asks to go
#                elsewhere, before denying it (default: 30)
#
# [guard]
# roots = ~/src/shared; /tmp/scratch
# ask_timeout = 60


# [tools]: background jobs, stopping commands, and search. A command
# still running at its timeout moves to the background as a job, and
# the agent is told when it ends.
#
#   job_timeout      seconds a background job may run, unless the agent
#                    asks for another limit (default: 1800)
#   job_timeout_max  most seconds the agent may ask for (default: 7200)
#   auto_resume      turns a session may start by itself in an hour, to
#                    report jobs that ended while it was idle; 0 for
#                    none (default: 5)
#   stop_grace       seconds between asking a command to stop (SIGTERM,
#                    or CTRL_BREAK on Windows) and killing it (default:
#                    2, or 3 on Windows)
#   use_rg           search with ripgrep, rg on PATH, when it is found;
#                    false always uses the built-in search (default:
#                    true)
#   task_budget      model requests a subagent may make before it is
#                    told to wrap up and report; at half as many again
#                    it is stopped, and its report is what it said last
#                    (default: 200)
#
# [tools]
# job_timeout = 3600


# [instructions]: files of instructions for the agent, read when a
# session starts: AGENTS.md in the default configuration directory
# (next to this file, unless -c named it), then one file in each
# directory from the root of the repository down to the working
# directory, and later ones below it, as the agent works there.
#
#   files  names to look for in each directory, the first one found
#          used, separated by blanks (default: AGENTS.md CLAUDE.md)
#
# [instructions]
# files = AGENTS.md


# [ui]: how the GUI looks.
#
#   theme  colors: dark, light, or system to follow the operating
#          system's setting as it changes (default: system)
#
# [ui]
# theme = light


# [host]: the engine as a background host ("prospero serve"), which
# "prospero attach" starts for a client over ssh, and reaches through a
# socket only this user may use (a named pipe on Windows). A window
# closed with "Keep running in background" makes its own process such
# a host, with a tray icon, until its sessions are done.
#
#   idle_exit  seconds the host waits with no client connected and
#              nothing running, then exits (default: 600)
#   grace      seconds the host keeps the place of a client whose
#              connection broke, and its records, for when it comes
#              back (default: 10800)
#
# [host]
# idle_exit = 3600


# [remote NAME]: an engine on another machine, reached over ssh, which
# "prospero attach" starts there if none runs ("prospero connect NAME").
# The window's Hosts panel adds one, and connects to it.
#
#   ssh     where ssh reaches the machine: [user@]host, or a Host of
#           ~/.ssh/config
#   path    the prospero executable there, a path or a name on its
#           PATH (default: the engine "prospero deploy NAME" put in
#           ~/.prospero there, else prospero)
#   state   the state directory there (default: its own)
#   config  the configuration file there (default: its own)
#   deploy  when the machine has no engine, or one of another
#           protocol: ask before deploying one, or auto to deploy it
#           unasked (default: ask)
#
# [remote pi]
# ssh = pi.local
# deploy = auto
